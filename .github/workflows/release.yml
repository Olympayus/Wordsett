name: Build macOS installer

# 触发：手动运行 或 push `v*` 标签（如 v0.3.4）。
# 在 GitHub 托管的 macOS 上构建 dmg，挂到 GitHub Release。
#
# 为什么只出 macOS：Windows 安装包由发布者本地构建，其签名与 latest.json 一致；
# CI 构建的包签名不同，若同时挂 Windows 会破坏自更新签名校验。
#
# 需要的仓库 Secrets：
#   TAURI_SIGNING_PRIVATE_KEY         — Wordsett.key 的内容（更新签名私钥）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD— 私钥密码（生成时设定）
# Apple 代码签名未配置（需 Apple Developer 证书）：macOS 用户首次需 右键→打开 绕过 Gatekeeper。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    # 调试用的测试 tag（带连字符，如 v0.8.0-ios1）只触发 iOS 构建，不在这里白跑 15 分钟。
    if: github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps
        run: npm install

      - name: Build dictionary DBs (gitignored, required)
        run: npm run build:dictionaries

      - name: Build macOS installer
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordsett-macos
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: warn

      - name: Attach to GitHub Release
        # 只挂正式版本 tag；测试 tag（带连字符）不建 Release。
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.sig
