name: Build iOS unsigned IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios
      - run: npm ci
      - run: npm run build:dictionaries
      - name: Prepare 1024 icon
        run: |
          sips -s format png --resampleHeightWidth 1024 1024 src-tauri/icons/icon.icns --out /tmp/icon-1024.png \
            || cp src-tauri/icons/icon.png /tmp/icon-1024.png
          npm run tauri -- icon /tmp/icon-1024.png
      - name: Ensure iOS project exists
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npm run tauri -- ios init --ci
          fi
      # 首次运行预期在最终链接失败：`tts_ios.rs`（T14）引用的 Swift 符号要等
      # `TtsBridge.swift`（T15）落进 `gen/apple` 后才存在。这不代表 init 失败——
      # 此时 `gen/apple` 已生成，下面的兜底上传仍会把工程交出来供用户补文件后重跑。
      - name: Build unsigned IPA
        run: npm run tauri -- ios build --target aarch64 --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: wordsett-ios-unsigned
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        # 构建失败（首次运行的预期链接失败）时也必须交出 `gen/apple`，
        # 否则用户轮拿不到可补 Swift 文件的工程，故这一步总是执行。
        if: always()
        with:
          name: wordsett-gen-apple
          path: src-tauri/gen/apple
          if-no-files-found: error
      - name: Attach to GitHub Release
        # 只挂正式版本 tag（v0.8.0）；测试 tag（v0.8.0-ios1 这类带连字符的）只留 artifact，
        # 免得每次调试都在 Releases 页留下一份半成品。
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/apple/build/**/*.ipa
