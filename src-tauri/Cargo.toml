[package]
name = "app"
version = "0.7.8"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
fsrs = "6"

# 单实例（00 篇 §6 总表 #9、04 篇 §2.6）。desktop-only：移动端没有「第二个实例」
# 这个概念，插件的 API 也只在桌面端编译。
#
# TTS 也挂在这里：`tts` 0.26 的 Android 后端要求 `rs/tts/Bridge` 这个 Java 类与
# `ndk_context` 的初始化，本仓库锁定的 tao 0.35 两样都不提供——`Tts::default()` 在手机上
# 会 panic 并 abort 进程（前端启动时就会探测 TTS）。手机先走 `src/tts_stub.rs` 的占位，
# Plan 3 再接 Android 后端。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# 全局热键（v0.7.9 划词收录，Task 6 接线）。**精确锁到 2.3.2**：accelerator 的
# 解析形状（`global-hotkey` 0.8）是 `shortcut.rs` 校验白名单的依据，升级插件必须
# 同步核对那张白名单。desktop-only：手机没有「全局热键」这个概念。
tauri-plugin-global-shortcut = "=2.3.2"
tts = "0.26"

# SAPI5 回退后端（spec §6.3）。windows 0.58 已由 Tauri 传递引入并锁在 Cargo.lock 里，
# 这里只是显式声明并开启 Speech/Com 两个 feature——不引新依赖树。
# 注意：版本号与 Tauri 的传递版本绑在一起，升级 Tauri 时须一并核对。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Speech", "Win32_System_Com"] }

# 屏幕方向（Task 10）：`set_screen_orientation` 在安卓上经 JNI 调 Activity.setRequestedOrientation。
# 只在安卓端引入——桌面不锁方向，这个 crate 也不参与它的依赖树。
# 不引 `ndk-context`：tao 0.35 从不初始化它（见 `orientation.rs` 文件头），Activity 走
# `PlatformWebview::jni_handle()` 那条通道取。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
